<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout}">

<div th:fragment="content">
    <h2>Login</h2>

    <!-- Spring Security sets ?error on the URL when login fails -->
    <div th:if="${param.error}" class="text-danger mb-3" style="font-weight:bold;">
        Invalid username or password.
    </div>

    <!-- Spring Security processes POST /login automatically.
         Fields must be named "username" and "password". -->
    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" />
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
    </form>
</div>

</html>
